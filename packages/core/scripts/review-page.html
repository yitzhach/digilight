<title>Looks review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: sticky bar (progress, filters), then a grid of picture cards; tap a picture for a full-screen viewer */
:root{--bg:#e9ebe8;--card:#f7f8f6;--fg:#1d211f;--muted:#5d6560;--line:#cfd4d0;--accent:#8a4b12;
--good:#2c6e47;--change:#9a6a10;--wrong:#9b3434;
--display:"Space Grotesk",system-ui,sans-serif;--body:"Inter",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161917;--card:#1f2320;--fg:#e6e9e6;--muted:#9aa39d;--line:#343a36;--accent:#e2a15e;--good:#6cc08e;--change:#e0b45a;--wrong:#e98080;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161917;--card:#1f2320;--fg:#e6e9e6;--muted:#9aa39d;--line:#343a36;--accent:#e2a15e;--good:#6cc08e;--change:#e0b45a;--wrong:#e98080;color-scheme:dark}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
main{max-width:1200px;margin:0 auto;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
h1{font-family:var(--display);font-weight:600;font-size:1.9rem;margin:0;text-wrap:balance}
.about{margin:0;color:var(--muted);max-width:65ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.count{margin-left:auto;color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums}
button{font:inherit;cursor:pointer;color:inherit}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 12px;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:10px;align-content:start;min-width:0}
.card[data-v="good"]{border-color:var(--good)}.card[data-v="change"]{border-color:var(--change)}.card[data-v="wrong"]{border-color:var(--wrong)}
.pic{padding:0;border:0;background:var(--line);display:block;cursor:zoom-in;border-radius:3px;overflow:hidden}
.pic img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover}
.head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.look{font-family:var(--display);font-weight:600;font-size:1.1rem}
.piece{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:600}
.stat{font-size:.8rem;color:var(--muted)}
.verdict{display:flex;gap:6px;flex-wrap:wrap}
.v{border:1px solid var(--line);background:none;border-radius:4px;padding:4px 10px;font-size:.88rem}
.v[data-k="good"][aria-pressed="true"]{background:var(--good);border-color:var(--good);color:var(--card)}
.v[data-k="change"][aria-pressed="true"]{background:var(--change);border-color:var(--change);color:var(--card)}
.v[data-k="wrong"][aria-pressed="true"]{background:var(--wrong);border-color:var(--wrong);color:var(--card)}
.noteRow{display:flex;gap:6px;align-items:flex-start}
textarea{flex:1;min-width:0;font:inherit;font-size:.95rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px;min-height:64px;resize:vertical}
.mic{flex:none;width:40px;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:50%;display:grid;place-items:center}
.mic[data-on="true"]{background:var(--wrong);border-color:var(--wrong);color:var(--card)}
.mic svg{width:18px;height:18px}
.partial{font-size:.85rem;color:var(--muted);font-style:italic;min-height:1.2em}
.saved{font-size:.78rem;color:var(--muted)}
.general{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;display:grid;gap:8px}
.general h2{font-family:var(--display);font-size:1.1rem;margin:0}
.notice{font-size:.88rem;color:var(--change)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(10,12,11,.94);display:grid;grid-template-rows:auto 1fr;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.viewer .vbar{display:flex;gap:8px;align-items:center;padding:10px 12px;color:#eee}
.viewer .vbar span{flex:1;min-width:0}
.viewer .vbar button{background:#2a2e2c;border:1px solid #444;color:#eee;border-radius:4px;padding:4px 12px}
.viewer img{width:100%;height:100%;object-fit:contain;min-height:0}
@media (prefers-reduced-motion:no-preference){.card{transition:border-color .15s}}
</style>

<main>
  <header style="display:grid;gap:6px">
    <h1 id="title">Looks review</h1>
    <p class="about" id="about"></p>
    <p class="notice" id="notice" hidden></p>
  </header>
  <div class="bar" role="toolbar" aria-label="Show">
    <button class="chip" data-f="all" aria-pressed="true">All</button>
    <span id="pieceChips" style="display:contents"></span>
    <button class="chip" data-f="todo" aria-pressed="false">Not marked yet</button>
    <span class="count" id="count"></span>
  </div>
  <section class="grid" id="grid" aria-label="Pictures"></section>
  <section class="general" id="general"></section>
</main>
<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="Picture">
  <div class="vbar"><span id="vname"></span><button id="vprev" aria-label="Previous picture">‹</button><button id="vnext" aria-label="Next picture">›</button><button id="vclose">Close</button></div>
  <img id="vimg" alt="">
</div>

<script>
const ROUND = /*ROUND*/null || {id:'example',title:'Looks review',about:'',items:[]};
const VERDICTS = [['good','Looks right'],['change','Needs a change'],['wrong','Wrong']];
const MIC = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const items = [...ROUND.items, {id:'general', piece:'', look:'General notes', general:true}];
const state = {};            // id -> {verdict, note}
let db = null, dict = null, listeningFor = null, filter = 'all';
const $ = (id) => document.getElementById(id);
const docId = (id) => `${ROUND.id}--${id}`;
const draftKey = (id) => `review:${docId(id)}`;
const getDraft = (id) => { try { return JSON.parse(localStorage.getItem(draftKey(id)) || 'null'); } catch { return null; } };
const setDraft = (id, v) => { try { localStorage.setItem(draftKey(id), JSON.stringify(v)); } catch {} };

$('title').textContent = ROUND.title; $('about').textContent = ROUND.about;
const pieces = [...new Set(ROUND.items.map((i) => i.piece))];
$('pieceChips').innerHTML = pieces.map((p) => `<button class="chip" data-f="${p}" aria-pressed="false">${p}</button>`).join('');

function card(it) {
  const el = document.createElement(it.general ? 'div' : 'article');
  el.className = 'card'; el.dataset.id = it.id;
  const help = ROUND.generalHelp || 'Anything about the looks as a set: what is missing, what you would use most.';
  el.innerHTML = `${it.general ? `<h2 class="look">General notes</h2><p class="stat">${help}</p>` :
    `<button class="pic" aria-label="Open ${it.look} on the ${it.piece} full screen"><img loading="lazy" src="${it.src}" alt="${it.piece}, ${it.look}"></button>
    <div class="head"><span class="look">${it.look}</span><span class="piece">${it.piece}</span></div>
    <div class="stat">${it.note || ''}</div>
    <div class="verdict">${VERDICTS.map(([k, l]) => `<button class="v" data-k="${k}" aria-pressed="false">${l}</button>`).join('')}</div>`}
    <div class="noteRow"><textarea id="note-${it.id}" aria-label="Note on ${it.look}${it.piece ? ', ' + it.piece : ''}" placeholder="${it.general ? 'Type or speak your notes' : 'What reads wrong? Type or speak'}"></textarea>
    <button class="mic" hidden aria-label="Speak a note" data-on="false">${MIC}</button></div>
    <div class="partial" hidden></div><div class="saved" aria-live="polite"></div>`;
  return el;
}
const grid = $('grid'), general = $('general');
for (const it of items) (it.general ? general : grid).appendChild(card(it));
if (general.firstChild) { general.replaceWith(general.firstChild); }

function paint(id) {
  const el = document.querySelector(`[data-id="${id}"]`), s = state[id] || {};
  if (!el) return;
  el.dataset.v = s.verdict || '';
  el.querySelectorAll('.v').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.k === s.verdict)));
  const ta = el.querySelector('textarea');
  if (document.activeElement !== ta && listeningFor !== id) ta.value = s.note || '';
}
function applyFilter() {
  let shown = 0, marked = 0;
  document.querySelectorAll('#grid .card').forEach((el) => {
    const it = items.find((i) => i.id === el.dataset.id), s = state[it.id] || {};
    if (s.verdict) marked++;
    const show = filter === 'all' || (filter === 'todo' ? !s.verdict : it.piece === filter);
    el.hidden = !show; if (show) shown++;
  });
  $('count').textContent = `${marked} of ${ROUND.items.length} marked`;
}

const timers = {};
function save(id, patch, now) {
  state[id] = { ...(state[id] || {}), ...patch };
  setDraft(id, state[id]);
  paint(id); applyFilter();
  clearTimeout(timers[id]);
  const run = async () => {
    const out = document.querySelector(`[data-id="${id}"] .saved`);
    if (!db) { out.textContent = 'Kept on this device only'; return; }
    const it = items.find((i) => i.id === id), s = state[id];
    try {
      await db.collection('notes').doc(docId(id)).set({ round: ROUND.id, item: id, piece: it.piece, look: it.look,
        verdict: s.verdict || '', note: s.note || '', updatedAt: new Date().toISOString() });
      out.textContent = 'Saved';
    } catch (e) { out.textContent = `Not saved: ${e && e.message ? e.message : 'try again'}`; }
  };
  if (now) run(); else timers[id] = setTimeout(run, 700);
}

document.addEventListener('click', (e) => {
  const v = e.target.closest('.v'), chip = e.target.closest('.chip'), pic = e.target.closest('.pic'), mic = e.target.closest('.mic');
  if (v) { const id = v.closest('[data-id]').dataset.id; save(id, { verdict: state[id]?.verdict === v.dataset.k ? '' : v.dataset.k }, true); }
  if (chip) { filter = chip.dataset.f; document.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c === chip))); applyFilter(); }
  if (pic) openViewer(pic.closest('[data-id]').dataset.id);
  if (mic) toggleMic(mic.closest('[data-id]').dataset.id);
});
document.addEventListener('input', (e) => {
  if (e.target.tagName === 'TEXTAREA') save(e.target.closest('[data-id]').dataset.id, { note: e.target.value });
});

// Dictation: one microphone, aimed at the card whose button was pressed.
function setMic(id, on) {
  document.querySelectorAll('.mic').forEach((b) => { const me = b.closest('[data-id]').dataset.id === id && on; b.dataset.on = String(me); b.setAttribute('aria-label', me ? 'Stop speaking' : 'Speak a note'); });
}
function toggleMic(id) {
  if (!dict) return;
  if (listeningFor === id) { dict.stop().catch(() => {}); return; }
  if (listeningFor) dict.stop().catch(() => {});
  listeningFor = id; setMic(id, true);
  dict.start().catch((err) => {
    listeningFor = null; setMic(id, false);
    const out = document.querySelector(`[data-id="${id}"] .saved`);
    if (err && err.code === 'not_granted') { document.querySelectorAll('.mic').forEach((b) => (b.hidden = true)); out.textContent = 'Speaking is off for this page; type instead'; }
    else if (err && err.code !== 'stopped') out.textContent = 'Could not start listening; try again or type';
  });
}
function partialEl(id) { return document.querySelector(`[data-id="${id}"] .partial`); }

let idx = 0;
const pics = () => ROUND.items.filter((i) => !document.querySelector(`[data-id="${i.id}"]`).hidden);
function openViewer(id) { const list = pics(); idx = Math.max(0, list.findIndex((i) => i.id === id)); showViewer(); $('viewer').hidden = false; $('vclose').focus(); }
function showViewer() { const list = pics(), it = list[idx]; if (!it) return; $('vimg').src = it.src; $('vimg').alt = `${it.piece}, ${it.look}`; $('vname').textContent = `${it.look} · ${it.piece}`; }
function step(d) { const n = pics().length; idx = (idx + d + n) % n; showViewer(); }
$('vprev').onclick = () => step(-1); $('vnext').onclick = () => step(1);
$('vclose').onclick = () => { $('viewer').hidden = true; };
document.addEventListener('keydown', (e) => {
  if ($('viewer').hidden) return;
  if (e.key === 'Escape') $('viewer').hidden = true; if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});

for (const it of items) { const d = getDraft(it.id); if (d) state[it.id] = d; paint(it.id); }
applyFilter();

(async () => {
  const use = window.claude && window.claude.use;
  if (!use) { $('notice').hidden = false; $('notice').textContent = 'Notes stay on this device here. Open this page on claude.ai to save them for Claude.'; return; }
  const [d, dc] = await Promise.all([use('db').catch(() => null), use('dictation').catch(() => null)]);
  dict = dc;
  if (dict) {
    document.querySelectorAll('.mic').forEach((b) => (b.hidden = false));
    dict.onPartial(({ text }) => { if (!listeningFor) return; const p = partialEl(listeningFor); p.hidden = !text; p.textContent = text; });
    dict.onFinal(({ text }) => {
      if (!listeningFor) return;
      const id = listeningFor, ta = document.getElementById(`note-${id}`);
      ta.value = (ta.value + text).replace(/^\s+/, ''); partialEl(id).hidden = true;
      save(id, { note: ta.value });
    });
    dict.onState(({ state: st }) => { if (st === 'idle') { const id = listeningFor; listeningFor = null; setMic(id, false); if (id) { partialEl(id).hidden = true; save(id, {}, true); } } });
  }
  db = d;
  if (!db) { $('notice').hidden = false; $('notice').textContent = 'Notes stay on this device: sign in to claude.ai to save them for Claude.'; return; }
  const timeout = setTimeout(() => { $('notice').hidden = false; $('notice').textContent = 'Saved notes are slow to load; new notes still save.'; }, 10000);
  db.collection('notes').where('round', '==', ROUND.id).onSnapshot((snap) => {
    clearTimeout(timeout);
    for (const doc of snap.docs) {
      const v = doc.data(); if (!v || !v.item) continue;
      if (timers[v.item] && document.activeElement && document.activeElement.closest(`[data-id="${v.item}"]`)) continue;
      state[v.item] = { verdict: v.verdict || '', note: v.note || '' };
      paint(v.item);
    }
    applyFilter();
  }, () => { clearTimeout(timeout); $('notice').hidden = false; $('notice').textContent = 'Could not load saved notes; reload the page.'; });
})();
</script>
